<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHALLAAN.COM Subscription</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #0f766e 0%, #042f2e 100%);
            --accent-pink: #ec4899;
            --btn-pink-gradient: linear-gradient(135deg, #f43f5e 0%, #db2777 100%);
            --text-color: #ffffff;
            --modal-bg: rgba(6, 78, 59, 0.95);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #111827;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Overlay Background */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;
        }

        /* Modal Box */
        .modal-card {
            background: var(--modal-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            color: var(--text-color);
            position: relative;
            animation: scaleUp 0.3s ease-out forwards;
        }

        @keyframes scaleUp {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Titles & Text */
        .brand-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #5eead4;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 24px;
            font-style: italic;
        }

        .modal-message {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 24px;
            font-weight: 500;
        }

        /* Pricing Text */
        .pricing-text {
            font-size: 15px;
            font-weight: 600;
            color: #fbcfe8;
            margin-bottom: 16px;
        }

        /* Buttons */
        .btn-premium {
            display: block;
            width: 100%;
            background: var(--btn-pink-gradient);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.6);
        }

        .btn-close {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px;
            text-decoration: underline;
            transition: color 0.2s;
        }

        .btn-close:hover {
            color: #ffffff;
        }

        /* Payment Info View (Hidden by default, shown on click) */
        .payment-info {
            display: none;
            background: rgba(0, 0, 0, 0.3);
            padding: 16px;
            border-radius: 12px;
            margin-top: 16px;
            text-align: left;
            font-size: 14px;
            line-height: 1.5;
            border: 1px dashed #5eead4;
        }

        .payment-info h4 {
            margin: 0 0 8px 0;
            color: #5eead4;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <!-- Header elements -->
            <div class="brand-title">DHALLAAN.COM</div>
            <div class="brand-subtitle">( kusoo dhawaw dunida dhallaanka )</div>

            <!-- Main Message -->
            <div class="modal-message">
                Dhiirrigeli akhriska iyo waxbarashada carruurtaada.
            </div>

            <!-- Pricing info -->
            <div class="pricing-text">kaliya 300 birr bishii</div>

            <!-- Premium Button -->
            <button class="btn-premium" id="premiumBtn" onclick="showPaymentInfo()">
                Hadda Is-diiwaangeli (Premium)
            </button>

            <!-- Payment Information Box (Appears when Premium is clicked) -->
            <div class="payment-info" id="paymentDetails">
                <h4>Macluumaadka Lacag-bixinta:</h4>
                <p><strong>Ku bixi EBIRR KAAFI:</strong> 0905445005</p>
                <p><strong>Magaca:</strong> MOOGE OMER EMAN</p>
            </div>

            <br>
            <!-- Close Button -->
            <button class="btn-close" onclick="closeModal()">Iska xir / Noqo bogga weyn</button>
        </div>
    </div>

    <script>
        function showPaymentInfo() {
            const paymentDiv = document.getElementById('paymentDetails');
            paymentDiv.style.display = paymentDiv.style.display === 'block' ? 'none' : 'block';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }
    </script>
</body>
</html>
