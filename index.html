<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caruur.com - Sheekooyin & Waxbarasho</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

  <!-- Header / Navbar Section -->
  <header class="bg-gradient-to-r from-orange-400 to-rose-400 text-white p-4 shadow-lg flex justify-between items-center rounded-b-3xl relative">
    <div>
      <h1 class="text-2xl font-extrabold tracking-wide">Caruur.com</h1>
      <p class="text-xs font-medium opacity-95">Sheekooyin Xikmad leh & Waxbarasho</p>
    </div>

    <!-- Top Right Nav / User Status Area -->
    <div class="relative">
      <button id="nav-user-btn" class="flex items-center space-x-2 bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full transition text-sm font-semibold">
        <span id="nav-user-label">Akoon</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.654 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </button>

      <!-- Dropdown menu when logged out -->
      <div id="nav-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-white text-slate-800 rounded-xl shadow-lg border border-slate-100 p-2 space-y-1 z-50">
        <button id="dropdown-login" class="w-full text-left px-3 py-2 text-xs font-semibold rounded-lg hover:bg-slate-100 text-teal-600">Soo gal (Login)</button>
        <button id="dropdown-signup" class="w-full text-left px-3 py-2 text-xs font-semibold rounded-lg hover:bg-slate-100 text-rose-500">Is-diiwaangeli</button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6 mt-4">
    
    <!-- Cloud Account Section -->
    <section class="space-y-3">
      <div class="flex items-center space-x-2 border-l-4 border-teal-500 pl-3">
        <h2 class="text-xl font-bold text-slate-900">Akoonka Isticmaalaha</h2>
      </div>

      <!-- Auth Container Box -->
      <div id="auth-container" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
        
        <!-- Form Header (Dynamic) -->
        <div>
          <h3 id="form-title" class="text-lg font-bold text-rose-500">Is-diiwaangeli (Sign Up)</h3>
          <p id="form-desc" class="text-xs text-slate-500 mt-1">Abuuri akoon daruuri ah si aad meel kasta uga gasho.</p>
        </div>

        <!-- Inputs and Actions Form -->
        <div id="auth-form" class="space-y-3">
          
          <!-- Inputs Wrapper (Hidden when logged in) -->
          <div id="inputs-wrapper" class="space-y-3">
            <div>
              <input type="email" id="email" autocomplete="email" placeholder="Email-kaaga" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-teal-500 text-sm bg-slate-50/50">
            </div>
            <div>
              <input type="password" id="password" autocomplete="current-password" placeholder="Furahaaga (Password)" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-teal-500 text-sm bg-slate-50/50">
            </div>
            <button id="action-btn" class="w-full py-2.5 bg-teal-500 text-white font-semibold rounded-xl shadow-md hover:bg-teal-600 transition text-sm">
              Is-diiwaangeli
            </button>
          </div>

          <!-- Logged-In User Panel (Hidden when logged out) -->
          <div id="logged-in-panel" class="hidden space-y-3 text-center py-2">
            <p class="text-sm font-semibold text-slate-700">Soo dhowow, <span id="user-display-name" class="text-teal-600"></span>!</p>
            <button id="logout-btn" class="w-full py-2.5 bg-rose-500 text-white font-semibold rounded-xl shadow-md hover:bg-rose-600 transition text-sm">
              Ka Bax (Log Out)
            </button>
          </div>

        </div>

        <!-- Toggle Mode Link -->
        <div id="toggle-container" class="text-center pt-1">
          <button id="toggle-mode-btn" class="text-xs text-slate-500 hover:text-teal-600 font-medium">
            Ma leedahay akoon hore? <span class="text-teal-600 underline">Soo gal (Login)</span>
          </button>
        </div>

        <!-- Feedback Message Area -->
        <div id="auth-message" class="text-xs text-center font-medium mt-2"></div>
      </div>
    </section>

    <!-- Free Stories Section -->
    <section class="space-y-3">
      <div class="border-l-4 border-teal-500 pl-3">
        <h2 class="text-xl font-bold text-slate-900">Sheekooyinka Bilaashka ah</h2>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 text-slate-500 text-sm">
        Halkan waxaa ku jira sheekooyinka carruurta ee aad lacag la'aanta ku akhrisan karto...
      </div>
    </section>

  </main>

  <!-- Firebase Logic Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-analytics.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBYIOzKPhH7FKwVMnF2DZGdxKnyJ_hUjEc",
      authDomain: "caruur-7a8ed.firebaseapp.com",
      projectId: "caruur-7a8ed",
      storageBucket: "caruur-7a8ed.firebasestorage.app",
      messagingSenderId: "586260137951",
      appId: "1:586260137951:web:1fd58321b963a6dcffe66a",
      measurementId: "G-X4RYC2YKDV"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);

    // UI Elements
    const formTitle = document.getElementById('form-title');
    const formDesc = document.getElementById('form-desc');
    const actionBtn = document.getElementById('action-btn');
    const toggleModeBtn = document.getElementById('toggle-mode-btn');
    const toggleContainer = document.getElementById('toggle-container');
    const authMessage = document.getElementById('auth-message');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    
    const inputsWrapper = document.getElementById('inputs-wrapper');
    const loggedInPanel = document.getElementById('logged-in-panel');
    const userDisplayName = document.getElementById('user-display-name');
    const logoutBtn = document.getElementById('logout-btn');

    // Nav elements
    const navUserBtn = document.getElementById('nav-user-btn');
    const navDropdown = document.getElementById('nav-dropdown');
    const dropdownLogin = document.getElementById('dropdown-login');
    const dropdownSignup = document.getElementById('dropdown-signup');
    const navUserLabel = document.getElementById('nav-user-label');

    let isLoginMode = false;

    // Toggle Dropdown Menu in Navbar
    navUserBtn.addEventListener('click', () => {
      navDropdown.classList.toggle('hidden');
    });

    dropdownLogin.addEventListener('click', () => {
      isLoginMode = true;
      updateFormMode();
      navDropdown.classList.add('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    dropdownSignup.addEventListener('click', () => {
      isLoginMode = false;
      updateFormMode();
      navDropdown.classList.add('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    function updateFormMode() {
      authMessage.textContent = '';
      if (isLoginMode) {
        formTitle.textContent = "Soo gal (Login)";
        formDesc.textContent = "Geli xogtaada si aad akoonkaaga u gasho.";
        actionBtn.textContent = "Soo gal";
        toggleModeBtn.innerHTML = `Ma leedahay akoon cusub? <span class="text-teal-600 underline">Is-diiwaangeli (Sign Up)</span>`;
      } else {
        formTitle.textContent = "Is-diiwaangeli (Sign Up)";
        formDesc.textContent = "Abuuri akoon daruuri ah si aad meel kasta uga gasho.";
        actionBtn.textContent = "Is-diiwaangeli";
        toggleModeBtn.innerHTML = `Ma leedahay akoon hore? <span class="text-teal-600 underline">Soo gal (Login)</span>`;
      }
    }

    toggleModeBtn.addEventListener('click', () => {
      isLoginMode = !isLoginMode;
      updateFormMode();
    });

    // Handle Form Action Button Click
    actionBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      authMessage.textContent = '';

      if (!email || !password) {
        authMessage.className = "text-xs text-center font-medium mt-2 text-rose-500";
        authMessage.textContent = "Fadlan buuxi email-ka iyo furaha (password).";
        return;
      }

      try {
        if (isLoginMode) {
          await signInWithEmailAndPassword(auth, email, password);
        } else {
          await createUserWithEmailAndPassword(auth, email, password);
        }
      } catch (error) {
        authMessage.className = "text-xs text-center font-medium mt-2 text-rose-600";
        authMessage.textContent = `Khalad: ${error.message}`;
      }
    });

    // Auto-login / Autofill check: Listen to input changes from password manager
    const handleAutofill = async () => {
      if (emailInput.value && passwordInput.value && !auth.currentUser) {
        try {
          await signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
        } catch (e) {
          // Ignore error during passive autofill triggers until manual submit
        }
      }
    };
    emailInput.addEventListener('input', handleAutofill);
    passwordInput.addEventListener('input', handleAutofill);

    // Logout Action
    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (error) {
        console.error("Logout error", error);
      }
    });

    // Monitor Auth State Changes Live
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Extract username prefix from email (e.g. abdifatahaadanmooge)
        const username = user.email.split('@')[0];

        // Update Nav bar area
        navUserLabel.textContent = username;
        navDropdown.classList.add('hidden');
        navUserBtn.classList.add('bg-teal-600', 'text-white');

        // Update Main Card Section
        formTitle.textContent = "Akoonkaaga";
        formDesc.textContent = "Waxaad si guul leh ugu jirtaa akoonkaaga.";
        inputsWrapper.classList.add('hidden');
        loggedInPanel.classList.remove('hidden');
        toggleContainer.classList.add('hidden');

        userDisplayName.textContent = user.email;
        authMessage.textContent = '';
      } else {
        // Reset Nav bar area
        navUserLabel.textContent = "Akoon";
        navUserBtn.classList.remove('bg-teal-600', 'text-white');

        // Reset Main Card Section
        updateFormMode();
        inputsWrapper.classList.remove('hidden');
        loggedInPanel.classList.add('hidden');
        toggleContainer.classList.remove('hidden');
        emailInput.value = '';
        passwordInput.value = '';
      }
    });
  </script>
</body>
</html>
